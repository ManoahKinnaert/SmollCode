[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "SmollCode"
version = "0.1.0"
description = "A minimal agentic coding terminal interface"
authors = [{name = "Manoah Kinnaert"}]
requires-python = ">=3.7"
dependencies = []

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["SmollCode"]